# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - PawnshopAdmin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: clean
        run: dotnet clean

      - name: Restore 
        run: dotnet restore

      - name: Build with dotnet
        run: dotnet build ./Admin.Blazor/Admin.Blazor/Admin.Blazor.csproj --configuration Release

      - name: Install wasm-tools workload 
        run: dotnet workload install wasm-tools

      - name: dotnet publish
        run: dotnet publish Admin.Blazor/Admin.Blazor/Admin.Blazor.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_52FA1588B3EA4FF3959B0CD24EFA62DF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F294126DDBC143A0B1E45199CE7C4D82 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_447EE109B4F64B53926BC9D48673E026 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'PawnshopAdmin'
          slot-name: 'Production'
          package: .
          