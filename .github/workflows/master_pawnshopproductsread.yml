# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - PawnshopProductsRead

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Clean
        run: dotnet clean

      - name: Restore 
        run: dotnet restore

      - name: Build with dotnet
        run: dotnet build ./Products.Read.API/Products.Read.API.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./Products.Read.API/Products.Read.API.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: install dotnet ef
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: craete migrations bundle v2
        run: >
          dotnet ef migrations bundle --runtime linux-x64
          --project ./Products.Read.API/Products.Read.API.csproj
          --output 'C:/Program Files/dotnet/myapp/migrate.exe'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F79D5DA98F334D21804D998D7F3EBB30 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D05C8E078AF34A9FB06671FB96520BF5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_890EB386A9E544AD89A66552C2DAB251 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'PawnshopProductsRead'
          slot-name: 'Production'
          package: .
          